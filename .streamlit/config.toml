[theme]
# Pinned so the page and st.context.theme agree; the map renderer picks its
# light/dark palette from the detected theme.
base = "light"
primaryColor = "#2E86AB"
headingFont = "Inter, sans-serif"
baseRadius = "medium"

[server]
headless = true
runOnSave = true

[runner]
# Bare expressions in the script must never leak onto the page.
magicEnabled = false

[browser]
gatherUsageStats = false
